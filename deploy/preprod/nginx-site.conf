# User-Core — la pré-production : un site NEUF sur le nginx de l'hôte partagé avec
# Scolaria (docs/ops/DEPLOIEMENT.md §6 et §7). MODÈLE sans secret ; aucun autre site
# n'est édité. Installé à l'étape 4 dans /etc/nginx/sites-available/user-core-preprod,
# lié dans sites-enabled, puis « nginx -t » et « reload » — jamais « restart ».
#
# Le certificat s'obtient par la méthode de Scolaria, relevée à l'étape 0, en
# « certonly » : ce fichier ne contient que ce que cette méthode laisse en place. Le bloc
# du port 80 peut donc changer d'après le relevé (le chemin du défi ACME, par exemple).
# IPv4 seulement, comme le reste de cet hôte : pas d'AAAA pour ce nom (§6.3).

server {
    listen 80;
    server_name id-preprod.swoi.app;

    location / {
        return 301 https://id-preprod.swoi.app$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name id-preprod.swoi.app;

    ssl_certificate     /etc/letsencrypt/live/id-preprod.swoi.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/id-preprod.swoi.app/privkey.pem;

    location / {
        # Le port publié du compose, sur la boucle locale de l'hôte seulement.
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        # 🔴 L'EXIGENCE (§6.1) : l'adresse vue par nginx en DERNIER. On ÉCRASE l'en-tête
        # du client, comme Scolaria — un seul saut, rien à démêler. Retransmettre l'en-tête
        # du client tel quel rendrait la dernière entrée forgeable, sans que le service
        # puisse le voir.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
